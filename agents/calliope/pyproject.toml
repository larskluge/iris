[project]
name = "calliope"
version = "0.1.0"
description = "Calliope — self-learning copywriter (Iris's first agent)"
readme = "README.md"
authors = [
    { name = "Lars", email = "l@larskluge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "letta-client>=1.12.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "typer>=0.26.7",
]

[project.scripts]
calliope = "calliope.cli:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langdetect>=1.0.9",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires running services (postgres/nats/letta/ollama)",
]
