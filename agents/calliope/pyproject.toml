[project]
name = "calliope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lars", email = "l@larskluge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
calliope = "calliope:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
