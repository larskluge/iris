# Calliope / Iris P0 control plane (localhost, podman compose).
# Model server (Ollama) runs NATIVE on the host (Metal) — not here — and is
# reached from containers via host.containers.internal:11434 (§7.6).
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: calliope
      POSTGRES_PASSWORD: calliope
      POSTGRES_DB: calliope
    ports: ["5434:5432"]   # 5433 is taken by mycelium_postgres on this host
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./postgres/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calliope"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2.10
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  letta:
    image: letta/letta:0.16.8   # pinned for reproducibility (§7.6)
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LETTA_PG_URI: postgresql://calliope:calliope@postgres:5432/calliope
      OLLAMA_BASE_URL: http://host.containers.internal:11434
    extra_hosts: ["host.containers.internal:host-gateway"]
    ports: ["8283:8283"]

volumes:
  pgdata:
